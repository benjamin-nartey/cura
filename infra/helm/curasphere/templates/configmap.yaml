apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway
  namespace: {{ .Values.namespace }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  OBJECT_STORE_BUCKET: {{ .Values.objectStoreBucket | quote }}
  CURASPHERE_HEALTH: {{ .Values.healthMode | quote }}
  CURASPHERE_DEPENDENCY_URL: {{ .Values.dependencyURL | quote }}
